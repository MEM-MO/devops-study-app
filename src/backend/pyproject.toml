[project]
name = "Study-tracker-backend"
version = "0.0.0"
description = "Backend APi fo tracking study time for DevOps certifications"
readme = "README.md"
authors = [{ name = "Memo", email = "memmo@duck.com" }]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "ruff>=0.17.5",
    "uvicorn>=0.54.0",
]

[project.scripts]
study-tracker-api = "backend.main:main"

[tool.uv.build-backend]
module-name = "backend"
module-root = "src"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
